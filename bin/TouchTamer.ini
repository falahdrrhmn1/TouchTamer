; TouchTamer settings. After changing a value, restart TouchTamer.
; On/off options use 1 for on and 0 for off.

[touchtamer]

; Brightness and volume gesture
level_gesture=1
; Keys to hold during the gesture: ctrl, alt, shift, or a combination such as ctrl+shift
gesture_mod=ctrl+shift
; Percent change for a swipe across the full height of the touchpad
full_height_pct=60

; Five-finger swipe moves a window
move_gesture=1
; Bigger is faster. At 100, a swipe across the touchpad width moves the window one screen width
move_speed_pct=150

; Alt+Up and Alt+Down change the window size
size_hotkeys=1
; Alt+Right and Alt+Left change the window width. Turn this off to keep Back and Forward in browsers and File Explorer
width_hotkeys=1

; On-screen percentage panel
hide_after_ms=850
alpha=245
; 1 = show the Windows volume overlay instead of the panel for volume
volume_native_osd=0

; 1 = write a diagnostic log, TouchTamer.log, next to TouchTamer.exe
debug=0
